# Builds a Quest APK whenever a pull request is merged into master, then uploads
# it to the Meta Horizon ALPHA release channel (invite-only, like TestFlight).
#
# Testers install it from the headset Library under My Preview Apps after they
# accept an invite from the app's Release Channels page.
#
# One-time setup, in GitHub → Settings → Secrets and variables → Actions:
#
#   UNITY_LICENSE              contents of the Unity .ulf license file
#                              macOS: /Library/Application Support/Unity/Unity_lic.ulf
#   UNITY_EMAIL                Unity account email
#   UNITY_PASSWORD             Unity account password (alphanumeric only)
#   ANDROID_KEYSTORE_BASE64    base64 of a release keystore. Create it once and
#                              keep the file; every future upload must use it:
#                                keytool -genkeypair -v -keystore quest-release.keystore \
#                                  -alias quest -keyalg RSA -keysize 2048 -validity 10000
#                                base64 -i quest-release.keystore | pbcopy
#   ANDROID_KEYSTORE_PASS
#   ANDROID_KEYALIAS_NAME      quest
#   ANDROID_KEYALIAS_PASS
#   META_APP_ID                Developer Dashboard → your app → Development → API
#   META_APP_SECRET
#
# The Meta app's package name must be com.henzebester.welovehenzeuwu.
# Invite the team on the ALPHA channel; it starts with nobody in it, including you.

name: Quest Alpha

on:
  pull_request:
    types: [closed]
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: quest-alpha
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  quest-alpha:
    name: Build and upload Quest APK
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Require Unity, keystore, and Meta secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: |
          missing=()
          for name in \
            UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD \
            ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASS \
            ANDROID_KEYALIAS_NAME ANDROID_KEYALIAS_PASS \
            META_APP_ID META_APP_SECRET
          do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing Actions secrets: ${missing[*]}. See the comment at the top of .github/workflows/quest-alpha.yml."
            exit 1
          fi

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Build Quest APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: auto
          buildsPath: build
          buildName: WeLoveHenzeUwU
          androidExportType: androidPackage
          versioning: Custom
          version: 0.1.${{ github.run_number }}
          androidVersionCode: ${{ github.run_number }}
          androidKeystoreName: quest-release.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Locate APK
        id: apk
        run: |
          apk=$(find build -type f -name '*.apk' | head -n 1)
          if [ -z "$apk" ]; then
            echo "::error::The Unity build did not produce an APK."
            find build -maxdepth 4 -type f || true
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "Found $apk"

      - name: Write release notes
        id: notes
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            notes="Manual Alpha build ${{ github.run_number }} (${{ github.sha }})"
          else
            notes="Merged PR #${{ github.event.pull_request.number }}: ${TITLE}"
          fi
          notes=$(printf '%s' "$notes" | tr '\n"' '  ' | cut -c1-500)
          echo "text=$notes" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quest-apk-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # setup-ovr-platform-util@v1 crashes on current util output
      # ("208.0.0") because its version regex requires four segments
      # (RageAgainstThePixel/setup-ovr-platform-util#33). Install the
      # Linux binary ourselves and put it on PATH for the upload action.
      - name: Install Oculus Platform Utility
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/ovr-platform-util"
          mkdir -p "$install_dir"
          curl -fsSL -o "$install_dir/ovr-platform-util" \
            'https://www.oculus.com/download_app/?id=5159709737372459'
          chmod +x "$install_dir/ovr-platform-util"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/ovr-platform-util" version

      - name: Upload to Meta ALPHA channel
        id: upload
        uses: RageAgainstThePixel/upload-meta-quest-build@v2
        with:
          appId: ${{ secrets.META_APP_ID }}
          appSecret: ${{ secrets.META_APP_SECRET }}
          apkPath: ${{ steps.apk.outputs.path }}
          releaseChannel: ALPHA
          ageGroup: TEENS_AND_ADULTS
          releaseNotes: ${{ steps.notes.outputs.text }}

      - name: Report upload
        run: echo "ALPHA build ${{ steps.upload.outputs.build_id }} is available to invited testers."
